name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
        pip install buildozer cython==0.29.36

    - name: Rename main
      run: cp main_light.py main.py

    - name: Rename spec
      run: cp buildozer_light.spec buildozer.spec

    - name: Build APK
      run: |
        export BUILDOZER_WARN_ON_ROOT=0
        yes | buildozer android debug
      timeout-minutes: 45

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WahidVR-APK
        path: bin/*.apk
        retention-days: 30
