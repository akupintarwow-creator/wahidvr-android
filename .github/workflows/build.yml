name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev automake git

    - name: Install buildozer
      run: pip install buildozer cython

    - name: Setup files
      run: |
        cp main_light.py main.py
        cp buildozer_light.spec buildozer.spec

    - name: Build
      env:
        BUILDOZER_WARN_ON_ROOT: '0'
      run: yes | buildozer android debug
      timeout-minutes: 60

    - name: Upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: APK
        path: bin/*.apk
        retention-days: 7
